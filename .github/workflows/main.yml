name: Release CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable-ci.yml
    with:
      version: 1.0.${{ github.run_number }}
      artifact-name: microsite-1.0.${{ github.run_number }}

  security:
    name: Security
    needs: ci
    uses: ./.github/workflows/reusable-security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  codeql:
    name: CodeQL
    needs: ci
    uses: ./.github/workflows/reusable-codeql.yml
    permissions:
      contents: read
      security-events: write

  release:
    name: Publish Release
    needs:
      - ci
      - security
      - codeql

    if: ${{ needs.ci.result == 'success' && needs.security.result == 'success' && needs.codeql.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v6
        with:
          name: microsite-1.0.${{ github.run_number }}

      - name: Verify artifact
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          test -f "microsite-${VERSION}.zip"
          echo "Validated artifact found"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            "microsite-${VERSION}.zip" \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "v${VERSION}" \
            --notes "Validated release ${VERSION}"

  summary:
    name: Release Summary
    needs:
      - ci
      - security
      - codeql
      - release

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Generate Summary
        env:
          VERSION: 1.0.${{ github.run_number }}
          CI_RESULT: ${{ needs.ci.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          RELEASE_RESULT: ${{ needs.release.result }}
        run: |
          echo "## Release Pipeline Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`microsite-${VERSION}.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI | ${CI_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Sonar + Trivy | ${SECURITY_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CodeQL | ${CODEQL_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub Release | ${RELEASE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "### CD Input" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use version: **${VERSION}**" >> "$GITHUB_STEP_SUMMARY"
