name: Release CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable-ci.yml
    with:
      version: 1.0.${{ github.run_number }}
      artifact-name: microsite-1.0.${{ github.run_number }}

  security:
    name: Security
    needs: ci
    uses: ./.github/workflows/reusable-security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: Publish Release
    needs: security
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: microsite-1.0.${{ github.run_number }}

      - name: Verify artifact
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          test -f "microsite-${VERSION}.zip"
          echo "Artifact verified"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            "microsite-${VERSION}.zip" \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "v${VERSION}" \
            --notes "Validated release ${VERSION}"

  summary:
    name: Final Validation Summary
    needs:
      - ci
      - security
      - release
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Generate final validation summary
        env:
          VERSION: 1.0.${{ github.run_number }}

          CI_RESULT: ${{ needs.ci.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RELEASE_RESULT: ${{ needs.release.result }}

          SONAR_GATE: ${{ needs.security.outputs.sonar_quality_gate }}
          SONAR_BUGS: ${{ needs.security.outputs.sonar_bugs }}
          SONAR_VULNERABILITIES: ${{ needs.security.outputs.sonar_vulnerabilities }}
          SONAR_HOTSPOTS: ${{ needs.security.outputs.sonar_hotspots }}
          SONAR_SMELLS: ${{ needs.security.outputs.sonar_code_smells }}
          SONAR_COVERAGE: ${{ needs.security.outputs.sonar_coverage }}
          SONAR_DUPLICATIONS: ${{ needs.security.outputs.sonar_duplications }}

          TRIVY_CRITICAL: ${{ needs.security.outputs.trivy_critical }}
          TRIVY_HIGH: ${{ needs.security.outputs.trivy_high }}

        run: |
          VALIDATION="VALID"

          if [ "${CI_RESULT}" != "success" ] || \
             [ "${SECURITY_RESULT}" != "success" ] || \
             [ "${RELEASE_RESULT}" != "success" ]; then
            VALIDATION="INVALID"
          fi

          echo "# Release Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`microsite-${VERSION}.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | **${VALIDATION}** |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## CI Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build / Test / Lint | ${CI_RESULT} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## SonarQube" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality Gate | ${SONAR_GATE:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bugs | ${SONAR_BUGS:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vulnerabilities | ${SONAR_VULNERABILITIES:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Hotspots | ${SONAR_HOTSPOTS:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Smells | ${SONAR_SMELLS:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage | ${SONAR_COVERAGE:-Unavailable}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duplications | ${SONAR_DUPLICATIONS:-Unavailable}% |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Trivy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Severity | Vulnerabilities |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Critical | ${TRIVY_CRITICAL:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| High | ${TRIVY_HIGH:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Release" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | ${RELEASE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`v${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${VALIDATION}" = "VALID" ]; then
            echo "## VALID" >> "$GITHUB_STEP_SUMMARY"
            echo "Release passed all required validation checks." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## INVALID" >> "$GITHUB_STEP_SUMMARY"
            echo "Release failed one or more required validation checks." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi