name: Release CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable-ci.yml
    with:
      version: 1.0.${{ github.run_number }}
      artifact-name: microsite-1.0.${{ github.run_number }}

  security:
    name: Security
    needs: ci
    uses: ./.github/workflows/reusable-security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: Publish Release
    needs:
      - ci
      - security

    if: ${{ needs.ci.result == 'success' && needs.security.result == 'success' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v5
        with:
          name: microsite-1.0.${{ github.run_number }}

      - name: Verify artifact
        run: |
          test -f "microsite-1.0.${{ github.run_number }}.zip"
          echo "Artifact verified"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: 1.0.${{ github.run_number }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            "microsite-${VERSION}.zip" \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "v${VERSION}" \
            --notes "Automated release from commit ${COMMIT_SHA}"

      - name: Release Summary
        env:
          VERSION: 1.0.${{ github.run_number }}
        run: |
          echo "## Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`microsite-${VERSION}.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| CI | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Release | Published |" >> "$GITHUB_STEP_SUMMARY"
