name: Release CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci
  cancel-in-progress: false

jobs:
  version:
    name: Generate Version
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: ${{ steps.version.outputs.artifact-name }}
      release-type: ${{ steps.version.outputs.release-type }}

    steps:
      - name: Generate version
        id: version
        shell: bash
        run: |
          BASE_VERSION="1.0.${GITHUB_RUN_NUMBER}"

          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            VERSION="${BASE_VERSION}"
            RELEASE_TYPE="release"
          else
            SAFE_BRANCH=$(echo "${GITHUB_REF_NAME}" \
              | tr '/_' '-' \
              | tr -cd '[:alnum:].-')

            VERSION="${BASE_VERSION}-SNAPSHOT-${SAFE_BRANCH}"
            RELEASE_TYPE="snapshot"
          fi

          ARTIFACT_NAME="microsite-${VERSION}"

          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact-name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"
          echo "release-type=${RELEASE_TYPE}" >> "$GITHUB_OUTPUT"

          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Version: ${VERSION}"
          echo "Artifact: ${ARTIFACT_NAME}"
          echo "Release type: ${RELEASE_TYPE}"

  ci:
    name: CI
    needs: version
    uses: ./.github/workflows/reusable-ci.yml
    with:
      version: ${{ needs.version.outputs.version }}
      artifact-name: ${{ needs.version.outputs.artifact-name }}

  security:
    name: Security
    needs:
      - version
      - ci
    uses: ./.github/workflows/reusable-security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: Publish Release
    needs:
      - version
      - security

    if: ${{ needs.version.outputs.release-type == 'release' }}

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download validated artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.version.outputs.artifact-name }}

      - name: Verify artifact
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          test -f "microsite-${VERSION}.zip"
          echo "Artifact verified: microsite-${VERSION}.zip"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          gh release create "v${VERSION}" \
            "microsite-${VERSION}.zip" \
            --repo "${REPOSITORY}" \
            --target "${COMMIT_SHA}" \
            --title "v${VERSION}" \
            --notes "Validated release ${VERSION}"

  summary:
    name: Final Validation Summary
    needs:
      - version
      - ci
      - security
      - release

    if: always()

    runs-on: ubuntu-latest

    steps:
      - name: Generate final validation summary
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ARTIFACT_NAME: ${{ needs.version.outputs.artifact-name }}
          RELEASE_TYPE: ${{ needs.version.outputs.release-type }}

          VERSION_RESULT: ${{ needs.version.result }}
          CI_RESULT: ${{ needs.ci.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          RELEASE_RESULT: ${{ needs.release.result }}

          SONAR_GATE: ${{ needs.security.outputs.sonar_quality_gate }}
          SONAR_BUGS: ${{ needs.security.outputs.sonar_bugs }}
          SONAR_VULNERABILITIES: ${{ needs.security.outputs.sonar_vulnerabilities }}
          SONAR_HOTSPOTS: ${{ needs.security.outputs.sonar_hotspots }}
          SONAR_SMELLS: ${{ needs.security.outputs.sonar_code_smells }}
          SONAR_COVERAGE: ${{ needs.security.outputs.sonar_coverage }}
          SONAR_DUPLICATIONS: ${{ needs.security.outputs.sonar_duplications }}

          TRIVY_CRITICAL: ${{ needs.security.outputs.trivy_critical }}
          TRIVY_HIGH: ${{ needs.security.outputs.trivy_high }}

        run: |
          VALIDATION="VALID"

          if [ "${VERSION_RESULT}" != "success" ] || \
             [ "${CI_RESULT}" != "success" ] || \
             [ "${SECURITY_RESULT}" != "success" ]; then
            VALIDATION="INVALID"
          fi

          if [ "${RELEASE_TYPE}" = "release" ] && \
             [ "${RELEASE_RESULT}" != "success" ]; then
            VALIDATION="INVALID"
          fi

          echo "# Release CI Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${GITHUB_REF_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Type | \`${RELEASE_TYPE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`${ARTIFACT_NAME}.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${GITHUB_SHA}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | **${VALIDATION}** |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## CI Validation" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build / Test / Lint | ${CI_RESULT} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## SonarQube" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Metric | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Quality Gate | ${SONAR_GATE:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Bugs | ${SONAR_BUGS:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Vulnerabilities | ${SONAR_VULNERABILITIES:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Security Hotspots | ${SONAR_HOTSPOTS:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Code Smells | ${SONAR_SMELLS:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Coverage | ${SONAR_COVERAGE:-Unavailable}% |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Duplications | ${SONAR_DUPLICATIONS:-Unavailable}% |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Trivy" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Severity | Vulnerabilities |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Critical | ${TRIVY_CRITICAL:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| High | ${TRIVY_HIGH:-Unavailable} |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "## Artifact Publication" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Check | Result |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          if [ "${RELEASE_TYPE}" = "release" ]; then
            echo "| Type | Official Release |" >> "$GITHUB_STEP_SUMMARY"
            echo "| GitHub Release | ${RELEASE_RESULT} |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Release Version | \`v${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Deployment Policy | DEV / UAT / PROD |" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "| Type | SNAPSHOT |" >> "$GITHUB_STEP_SUMMARY"
            echo "| GitHub Release | Not created |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Actions Artifact | \`${ARTIFACT_NAME}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Deployment Policy | DEV only |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "---" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${VALIDATION}" = "VALID" ]; then
            echo "## VALID" >> "$GITHUB_STEP_SUMMARY"

            if [ "${RELEASE_TYPE}" = "release" ]; then
              echo "Official release passed all required validation checks." >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Snapshot build passed all required validation checks." >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "## INVALID" >> "$GITHUB_STEP_SUMMARY"
            echo "Build failed one or more required validation checks." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi