name: Release CI

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-ci
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/reusable-ci.yml
    with:
      version: 1.0.${{ github.run_number }}
      artifact-name: microsite-1.0.${{ github.run_number }}

  security:
    name: Security
    uses: ./.github/workflows/reusable-security.yml
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  release:
    name: Publish Release
    needs:
      - ci
      - security

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: microsite-1.0.${{ github.run_number }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            "microsite-1.0.${{ github.run_number }}.zip" \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "v1.0.${{ github.run_number }}" \
            --notes "Automated release from commit ${{ github.sha }}"

      - name: Release Summary
        run: |
          echo "## Release Created" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** \`1.0.${{ github.run_number }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Artifact:** \`microsite-1.0.${{ github.run_number }}.zip\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Use version **1.0.${{ github.run_number }}** in the Deployment workflow." >> "$GITHUB_STEP_SUMMARY"
