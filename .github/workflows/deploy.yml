name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback

      version:
        description: "Required for deploy. Leave empty for PROD rollback."
        required: false
        type: string

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deployment

    uses: ./.github/workflows/reusable-deploy-validate.yml

    with:
      action: ${{ inputs.action }}
      version: ${{ inputs.version }}
      environment: ${{ inputs.environment }}

  approve-uat:
    name: UAT Approval

    needs: validate

    if: ${{ inputs.environment == 'uat' && inputs.action == 'deploy' }}

    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:
      - name: UAT approved
        run: echo "UAT deployment approved"

  approve-prod:
    name: Production Approval

    needs: validate

    if: ${{ inputs.environment == 'prod' }}

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Production approved
        env:
          ACTION: ${{ inputs.action }}
          VERSION: ${{ needs.validate.outputs.effective_version }}
        run: |
          echo "Production ${ACTION} approved"
          echo "Version: ${VERSION}"

  deploy-dev:
    name: Deploy dev

    needs: validate

    if: ${{ inputs.environment == 'dev' && inputs.action == 'deploy' }}

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      version: ${{ needs.validate.outputs.effective_version }}
      environment: dev
      artifact_source: ${{ needs.validate.outputs.artifact_source }}
      deployment_action: deploy

  deploy-uat:
    name: Deploy uat

    needs:
      - validate
      - approve-uat

    if: ${{ inputs.environment == 'uat' && inputs.action == 'deploy' }}

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      version: ${{ needs.validate.outputs.effective_version }}
      environment: uat
      artifact_source: release
      deployment_action: deploy

  deploy-prod:
    name: Deploy prod

    needs:
      - validate
      - approve-prod

    if: ${{ inputs.environment == 'prod' }}

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      version: ${{ needs.validate.outputs.effective_version }}
      environment: prod
      artifact_source: release
      deployment_action: ${{ inputs.action }}