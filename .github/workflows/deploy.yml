name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, example 1.0.32"
        required: true
        type: string

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    steps:
      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'

          echo "Environment: ${DEPLOY_ENV}"
          echo "Version: ${VERSION}"

          if ! [[ "${VERSION}" =~ ${RELEASE_PATTERN} ]]; then
            echo ""
            echo "INVALID VERSION: ${VERSION}"
            echo ""
            echo "Only published release versions can be deployed."
            echo ""
            echo "Valid examples:"
            echo "  1.0.32"
            echo "  1.0.33"
            echo "  2.1.0"
            echo ""
            echo "Invalid examples:"
            echo "  1.0.10-SNAPSHOT-pr-9"
            echo "  1.0.32-SNAPSHOT"
            echo "  v1.0.32"
            exit 1
          fi

          if ! gh release view "v${VERSION}" \
            --repo "${REPOSITORY}" \
            >/dev/null 2>&1; then

            echo ""
            echo "INVALID RELEASE"
            echo ""
            echo "GitHub Release v${VERSION} does not exist."
            echo ""
            echo "Use a version published by Release CI."
            echo "Example: 1.0.32"
            exit 1
          fi

          echo ""
          echo "Release v${VERSION} exists."
          echo "Deployment validation successful."

  approve-uat:
    name: UAT Approval
    needs: validate
    if: ${{ inputs.environment == 'uat' }}
    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:
      - name: UAT approved
        run: echo "UAT deployment approved"

  approve-prod:
    name: Production Approval
    needs: validate
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Production approved
        run: echo "Production deployment approved"

  deploy-dev:
    name: Deploy dev
    needs: validate
    if: ${{ inputs.environment == 'dev' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: dev

  deploy-uat:
    name: Deploy uat
    needs:
      - validate
      - approve-uat
    if: ${{ inputs.environment == 'uat' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: uat

  deploy-prod:
    name: Deploy prod
    needs:
      - validate
      - approve-prod
    if: ${{ inputs.environment == 'prod' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: prod