name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version: 1.0.35 or 1.0.11-SNAPSHOT-pr-10"
        required: true
        type: string

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest

    outputs:
      artifact_source: ${{ steps.validate.outputs.artifact_source }}

    steps:
      - name: Validate deployment version
        id: validate
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          RELEASE_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+$'
          SNAPSHOT_PATTERN='^[0-9]+\.[0-9]+\.[0-9]+-SNAPSHOT-pr-[0-9]+$'

          echo "Environment: ${DEPLOY_ENV}"
          echo "Version: ${VERSION}"

          if [[ "${VERSION}" =~ ${SNAPSHOT_PATTERN} ]]; then

            if [ "${DEPLOY_ENV}" != "dev" ]; then
              echo ""
              echo "INVALID VERSION"
              echo ""
              echo "PR SNAPSHOT versions can only be deployed to DEV."
              echo ""
              echo "Provided:"
              echo "  ${VERSION}"
              echo ""
              echo "UAT and PROD require a published release version."
              echo ""
              echo "Valid example:"
              echo "  1.0.35"
              exit 1
            fi

            ARTIFACT_NAME="microsite-${VERSION}"

            ARTIFACT_ID=$(gh api \
              "repos/${REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" \
              --jq '.artifacts | map(select(.expired == false)) | sort_by(.created_at) | reverse | .[0].id // empty')

            if [ -z "${ARTIFACT_ID}" ]; then
              echo ""
              echo "SNAPSHOT ARTIFACT NOT FOUND"
              echo ""
              echo "Expected Actions artifact:"
              echo "  ${ARTIFACT_NAME}"
              echo ""
              echo "The PR CI workflow must complete successfully first."
              exit 1
            fi

            echo "PR artifact found: ${ARTIFACT_NAME}"
            echo "artifact_source=snapshot" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${VERSION}" =~ ${RELEASE_PATTERN} ]]; then

            if ! gh release view "v${VERSION}" \
              --repo "${REPOSITORY}" \
              >/dev/null 2>&1; then

              echo ""
              echo "RELEASE NOT FOUND"
              echo ""
              echo "GitHub Release v${VERSION} does not exist."
              echo ""
              echo "Use a version published by Release CI."
              echo ""
              echo "Example:"
              echo "  1.0.35"
              exit 1
            fi

            echo "Published release found: v${VERSION}"
            echo "artifact_source=release" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo ""
          echo "INVALID VERSION"
          echo ""
          echo "Allowed DEV versions:"
          echo "  1.0.35"
          echo "  1.0.11-SNAPSHOT-pr-10"
          echo ""
          echo "Allowed UAT/PROD versions:"
          echo "  1.0.35"
          echo ""
          echo "Invalid examples:"
          echo "  v1.0.35"
          echo "  1.0.35-SNAPSHOT"
          echo "  test"
          exit 1

  approve-uat:
    name: UAT Approval
    needs: validate
    if: ${{ inputs.environment == 'uat' }}
    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:
      - name: UAT approved
        run: echo "UAT deployment approved"

  approve-prod:
    name: Production Approval
    needs: validate
    if: ${{ inputs.environment == 'prod' }}
    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Production approved
        run: echo "Production deployment approved"

  deploy-dev:
    name: Deploy dev
    needs: validate
    if: ${{ inputs.environment == 'dev' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: dev
      artifact_source: ${{ needs.validate.outputs.artifact_source }}

  deploy-uat:
    name: Deploy uat
    needs:
      - validate
      - approve-uat
    if: ${{ inputs.environment == 'uat' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: uat
      artifact_source: release

  deploy-prod:
    name: Deploy prod
    needs:
      - validate
      - approve-prod
    if: ${{ inputs.environment == 'prod' }}
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      version: ${{ inputs.version }}
      environment: prod
      artifact_source: release