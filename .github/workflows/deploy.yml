name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, example 1.0.17"
        required: true
        type: string

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:

  approval:
    name: Approval - ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Deployment approved
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          echo "Deployment approved for ${DEPLOY_ENV}"


  deploy:
    name: Deploy ${{ inputs.environment }}

    needs:
      - approval

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.urls.outputs.deploy_url }}

    steps:

      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${REPOSITORY}" \
            --pattern "microsite-${VERSION}.zip"

      - name: Extract release
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p release

          unzip \
            "microsite-${VERSION}.zip" \
            -d release

          test -f release/index.html


      - name: Restore previous Pages content
        run: |
          mkdir -p site

          if git ls-remote --exit-code origin refs/heads/pages-state; then
            git fetch origin pages-state
            git --work-tree=site checkout origin/pages-state -- . || true
          fi


      - name: Prepare environment
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |

          if [ "${DEPLOY_ENV}" = "prod" ]; then

            find site \
              -maxdepth 1 \
              -type f \
              -delete

            cp -R release/. site/

          else

            rm -rf "site/${DEPLOY_ENV}"

            mkdir -p "site/${DEPLOY_ENV}"

            cp -R release/. "site/${DEPLOY_ENV}/"

          fi


      - name: Save Pages state
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |

          rm -rf pages-state-work

          mkdir pages-state-work

          cp -R site/. pages-state-work/

          cd pages-state-work

          git init

          git checkout -b pages-state

          git config user.name "github-actions"

          git config user.email "github-actions@github.com"

          git add .

          git commit \
            -m "deploy ${VERSION} to ${DEPLOY_ENV}"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin pages-state


      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5


      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site


      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5


      - name: Calculate deployment URL
        id: urls
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |

          BASE_URL="${PAGE_URL%/}"

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            DEPLOY_URL="${BASE_URL}/"
          else
            DEPLOY_URL="${BASE_URL}/${DEPLOY_ENV}/"
          fi

          echo "deploy_url=${DEPLOY_URL}" \
            >> "$GITHUB_OUTPUT"

          echo "Deployment URL: ${DEPLOY_URL}"


      - name: Playwright post-deployment test
        id: playwright
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
        run: |
          npx playwright test


      - name: Deployment Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
          JOB_STATUS: ${{ job.status }}
        run: |

          echo "## Deployment Summary" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Value |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "|---|---|" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Version | \`${VERSION}\` |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Environment | \`${DEPLOY_ENV}\` |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Artifact | \`microsite-${VERSION}.zip\` |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Playwright | ${PLAYWRIGHT_RESULT} |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "| Deployment | ${JOB_STATUS} |" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "### Live URL" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "" \
            >> "$GITHUB_STEP_SUMMARY"

          echo "${DEPLOY_URL}" \
            >> "$GITHUB_STEP_SUMMARY"
