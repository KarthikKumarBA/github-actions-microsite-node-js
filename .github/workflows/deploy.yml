name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version to deploy
        required: true
        type: string

      environment:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: ${{ inputs.environment }}

    steps:
      - name: Download release artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${REPOSITORY}" \
            --pattern "microsite-${VERSION}.zip"

      - name: Extract artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p dist
          unzip "microsite-${VERSION}.zip" -d dist

      - name: Verify artifact
        run: |
          test -f dist/index.html
          echo "Artifact validation successful"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Deployment Summary
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${DEPLOY_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`microsite-${VERSION}.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Deployed |" >> "$GITHUB_STEP_SUMMARY"
