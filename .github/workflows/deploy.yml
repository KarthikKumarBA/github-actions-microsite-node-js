name: Deploy

on:
  workflow_run:
    workflows:
      - "Release CI"
    types:
      - completed

  workflow_dispatch:
    inputs:
      action:
        description: "Deployment action"
        required: true
        type: choice
        default: deploy
        options:
          - deploy
          - rollback

      version:
        description: "Required for manual deploy. Leave empty for PROD rollback."
        required: false
        type: string

      environment:
        description: "Environment to deploy"
        required: true
        type: choice
        options:
          - dev
          - uat
          - prod

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-deployment
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve Deployment Request
    runs-on: ubuntu-latest

    outputs:
      action: ${{ steps.resolve.outputs.action }}
      version: ${{ steps.resolve.outputs.version }}
      environment: ${{ steps.resolve.outputs.environment }}
      automatic: ${{ steps.resolve.outputs.automatic }}

    steps:
      - name: Resolve deployment
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RESULT: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
          WORKFLOW_BRANCH: ${{ github.event.workflow_run.head_branch }}
          INPUT_ACTION: ${{ inputs.action }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_run" ]; then

            if [ "${WORKFLOW_RESULT}" != "success" ]; then
              echo "Release CI did not succeed."
              exit 1
            fi

            if [ "${WORKFLOW_BRANCH}" != "main" ]; then
              echo "Automatic DEV deployment is allowed only for main."
              exit 1
            fi

            VERSION="1.0.${WORKFLOW_RUN_NUMBER}"

            echo "action=deploy" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "environment=dev" >> "$GITHUB_OUTPUT"
            echo "automatic=true" >> "$GITHUB_OUTPUT"

            echo "Automatic DEV deployment"
            echo "Version: ${VERSION}"

          else

            echo "action=${INPUT_ACTION}" >> "$GITHUB_OUTPUT"
            echo "version=${INPUT_VERSION}" >> "$GITHUB_OUTPUT"
            echo "environment=${INPUT_ENVIRONMENT}" >> "$GITHUB_OUTPUT"
            echo "automatic=false" >> "$GITHUB_OUTPUT"

          fi

  validate:
    name: Validate Deployment
    needs: resolve

    uses: ./.github/workflows/reusable-deploy-validate.yml

    with:
      action: ${{ needs.resolve.outputs.action }}
      version: ${{ needs.resolve.outputs.version }}
      environment: ${{ needs.resolve.outputs.environment }}

  approve-uat:
    name: UAT Approval

    needs:
      - resolve
      - validate

    if: ${{ needs.resolve.outputs.environment == 'uat' && needs.resolve.outputs.action == 'deploy' }}

    runs-on: ubuntu-latest

    environment:
      name: uat

    steps:
      - name: UAT approved
        run: echo "UAT deployment approved"

  approve-prod:
    name: Production Approval

    needs:
      - resolve
      - validate

    if: ${{ needs.resolve.outputs.environment == 'prod' }}

    runs-on: ubuntu-latest

    environment:
      name: prod

    steps:
      - name: Production approved
        env:
          ACTION: ${{ needs.resolve.outputs.action }}
          VERSION: ${{ needs.validate.outputs.effective_version }}
        run: |
          echo "Production ${ACTION} approved"
          echo "Version: ${VERSION}"

  deploy-dev:
    name: Deploy DEV

    needs:
      - resolve
      - validate

    if: ${{ needs.resolve.outputs.environment == 'dev' && needs.resolve.outputs.action == 'deploy' }}

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      version: ${{ needs.validate.outputs.effective_version }}
      environment: dev
      artifact_source: ${{ needs.validate.outputs.artifact_source }}
      deployment_action: deploy

  deploy-uat:
    name: Deploy UAT

    needs:
      - resolve
      - validate
      - approve-uat

    if: ${{ needs.resolve.outputs.environment == 'uat' && needs.resolve.outputs.action == 'deploy' }}

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      version: ${{ needs.validate.outputs.effective_version }}
      environment: uat
      artifact_source: release
      deployment_action: deploy

  deploy-prod:
    name: Deploy PROD

    needs:
      - resolve
      - validate
      - approve-prod

    if: ${{ needs.resolve.outputs.environment == 'prod' }}

    uses: ./.github/workflows/reusable-deploy.yml

    with:
      version: ${{ needs.validate.outputs.effective_version }}
      environment: prod
      artifact_source: release
      deployment_action: ${{ needs.resolve.outputs.action }}