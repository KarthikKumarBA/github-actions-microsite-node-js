name: Reusable Deploy

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

      environment:
        required: true
        type: string

      artifact_source:
        required: true
        type: string

      deployment_action:
        required: false
        type: string
        default: deploy

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.urls.outputs.deploy_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download published release artifact
        if: ${{ inputs.artifact_source == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${REPOSITORY}" \
            --pattern "microsite-${VERSION}.zip"

      - name: Download PR snapshot artifact
        if: ${{ inputs.artifact_source == 'snapshot' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT_NAME="microsite-${VERSION}"

          ARTIFACT_ID=$(gh api \
            "repos/${REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" \
            --jq '
              .artifacts
              | map(select(.expired == false))
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty
            ')

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "Snapshot artifact not found: ${ARTIFACT_NAME}"
            exit 1
          fi

          mkdir -p snapshot-download

          gh api \
            "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > snapshot-download/artifact.zip

          unzip \
            snapshot-download/artifact.zip \
            -d snapshot-download/content

          cp \
            "snapshot-download/content/microsite-${VERSION}.zip" \
            "microsite-${VERSION}.zip"

      - name: Verify artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f "microsite-${VERSION}.zip"
          echo "Artifact verified: microsite-${VERSION}.zip"

      - name: Extract artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf release
          mkdir -p release

          unzip \
            "microsite-${VERSION}.zip" \
            -d release

          test -f release/index.html

          echo "Release content:"
          find release -maxdepth 2 -type f | sort

      - name: Restore existing Pages content
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf site
          rm -rf pages-existing

          mkdir -p site

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote "${REPO_URL}" refs/heads/pages-state | grep -q pages-state; then

            git clone \
              --depth 1 \
              --single-branch \
              --branch pages-state \
              "${REPO_URL}" \
              pages-existing

            cp -R pages-existing/. site/
            rm -rf site/.git

          else
            echo "pages-state branch does not exist yet."
          fi

      - name: Backup current deployment
        run: |
          rm -rf site-before-deploy
          mkdir -p site-before-deploy

          cp -R site/. site-before-deploy/

      - name: Read deployment state
        id: state
        run: |
          STATE_FILE="site/.deployment-state/deployment-state.json"

          UAT_VERSION=""
          CURRENT_PROD=""
          PREVIOUS_PROD=""
          PROD_HISTORY_COUNT="0"

          if [ -f "${STATE_FILE}" ]; then
            UAT_VERSION=$(jq -r '.uat_version // ""' "${STATE_FILE}")
            CURRENT_PROD=$(jq -r '.prod_current_version // ""' "${STATE_FILE}")
            PREVIOUS_PROD=$(jq -r '.prod_previous_version // ""' "${STATE_FILE}")
            PROD_HISTORY_COUNT=$(jq -r '.prod_history // [] | length' "${STATE_FILE}")
          fi

          echo "uat_version=${UAT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current_prod=${CURRENT_PROD}" >> "$GITHUB_OUTPUT"
          echo "previous_prod=${PREVIOUS_PROD}" >> "$GITHUB_OUTPUT"
          echo "prod_history_count=${PROD_HISTORY_COUNT}" >> "$GITHUB_OUTPUT"

          echo "UAT: ${UAT_VERSION:-None}"
          echo "PROD Current: ${CURRENT_PROD:-None}"
          echo "PROD Previous: ${PREVIOUS_PROD:-None}"
          echo "PROD History: ${PROD_HISTORY_COUNT}"

      - name: Prepare environment content
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [ "${DEPLOY_ENV}" = "prod" ]; then

            rm -rf preserve-pages
            mkdir -p preserve-pages

            if [ -d "site/dev" ]; then
              cp -R site/dev preserve-pages/dev
            fi

            if [ -d "site/uat" ]; then
              cp -R site/uat preserve-pages/uat
            fi

            if [ -d "site/.deployment-state" ]; then
              cp -R \
                site/.deployment-state \
                preserve-pages/.deployment-state
            fi

            rm -rf site
            mkdir -p site

            cp -R release/. site/

            if [ -d "preserve-pages/dev" ]; then
              cp -R preserve-pages/dev site/dev
            fi

            if [ -d "preserve-pages/uat" ]; then
              cp -R preserve-pages/uat site/uat
            fi

            if [ -d "preserve-pages/.deployment-state" ]; then
              cp -R \
                preserve-pages/.deployment-state \
                site/.deployment-state
            fi

          else

            rm -rf "site/${DEPLOY_ENV}"
            mkdir -p "site/${DEPLOY_ENV}"

            cp -R release/. "site/${DEPLOY_ENV}/"

          fi

      - name: Verify prepared Pages content
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [ "${DEPLOY_ENV}" = "prod" ]; then
            test -f site/index.html
          else
            test -f "site/${DEPLOY_ENV}/index.html"
          fi

          echo "${DEPLOY_ENV} content verified."

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Calculate deployment URL
        id: urls
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          BASE_URL="${PAGE_URL%/}"

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            DEPLOY_URL="${BASE_URL}/"
          else
            DEPLOY_URL="${BASE_URL}/${DEPLOY_ENV}/"
          fi

          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: ${DEPLOY_URL}"

      - name: Wait for GitHub Pages
        id: health
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
        run: |
          for i in {1..12}; do

            STATUS=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              "${DEPLOY_URL}?deployment=${GITHUB_RUN_ID}")

            echo "Attempt ${i}: HTTP ${STATUS}"

            if [ "${STATUS}" = "200" ]; then
              exit 0
            fi

            sleep 10
          done

          exit 1

      - name: Run Playwright post-deployment test
        id: playwright
        if: ${{ steps.health.outcome == 'success' }}
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          npx playwright test --reporter=html

      - name: Upload Playwright test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.environment }}-${{ inputs.version }}
          path: playwright-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Determine validation result
        id: validation
        env:
          HEALTH_RESULT: ${{ steps.health.outcome }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
        run: |
          if [ "${HEALTH_RESULT}" = "success" ] && \
             [ "${PLAYWRIGHT_RESULT}" = "success" ]; then

            echo "valid=true" >> "$GITHUB_OUTPUT"
            echo "Deployment validation: VALID"

          else

            echo "valid=false" >> "$GITHUB_OUTPUT"
            echo "Deployment validation: INVALID"

          fi

      - name: Restore previous PROD content
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        run: |
          rm -rf site
          mkdir -p site

          cp -R site-before-deploy/. site/

          test -f site/index.html

      - name: Upload rollback Pages artifact
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-rollback
          path: site

      - name: Deploy automatic rollback
        id: rollback
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback

      - name: Verify automatic rollback
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
        run: |
          for i in {1..12}; do

            STATUS=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              "${DEPLOY_URL}?rollback=${GITHUB_RUN_ID}")

            echo "Rollback check ${i}: HTTP ${STATUS}"

            if [ "${STATUS}" = "200" ]; then
              echo "Automatic PROD rollback successful."
              exit 0
            fi

            sleep 10
          done

          exit 1

      - name: Save successful deployment state
        if: ${{ steps.validation.outputs.valid == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          DEPLOY_ACTION: ${{ inputs.deployment_action }}
        run: |
          rm -rf pages-state-work

          REPO_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          if git ls-remote "${REPO_URL}" refs/heads/pages-state | grep -q pages-state; then

            git clone \
              --depth 1 \
              --single-branch \
              --branch pages-state \
              "${REPO_URL}" \
              pages-state-work

          else

            mkdir -p pages-state-work

            cd pages-state-work

            git init
            git checkout -b pages-state
            git remote add origin "${REPO_URL}"

            cd ..
          fi

          STATE_DIR="pages-state-work/.deployment-state"
          STATE_FILE="${STATE_DIR}/deployment-state.json"

          mkdir -p "${STATE_DIR}"

          if [ ! -f "${STATE_FILE}" ]; then
            cat > "${STATE_FILE}" <<EOF
          {
            "uat_version": "",
            "uat_deployed_at": "",
            "prod_current_version": "",
            "prod_previous_version": "",
            "prod_deployed_at": "",
            "prod_history": []
          }
          EOF
          fi

          jq '
            .uat_version = (.uat_version // "")
            | .uat_deployed_at = (.uat_deployed_at // "")
            | .prod_current_version = (.prod_current_version // "")
            | .prod_previous_version = (.prod_previous_version // "")
            | .prod_deployed_at = (.prod_deployed_at // "")
            | .prod_history = (.prod_history // [])
          ' "${STATE_FILE}" > "${STATE_FILE}.tmp"

          mv "${STATE_FILE}.tmp" "${STATE_FILE}"

          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "${DEPLOY_ENV}" = "uat" ]; then

            jq \
              --arg version "${VERSION}" \
              --arg deployed_at "${DEPLOYED_AT}" \
              '
                .uat_version = $version
                | .uat_deployed_at = $deployed_at
              ' \
              "${STATE_FILE}" > "${STATE_FILE}.tmp"

            mv "${STATE_FILE}.tmp" "${STATE_FILE}"
          fi

          if [ "${DEPLOY_ENV}" = "prod" ]; then

            PREVIOUS_DISTINCT=$(jq -r \
              --arg current "${VERSION}" \
              '
                [
                  (.prod_current_version // ""),
                  (.prod_history // [])[].version
                ]
                | map(select(. != "" and . != $current))
                | .[0] // ""
              ' \
              "${STATE_FILE}")

            jq \
              --arg version "${VERSION}" \
              --arg previous "${PREVIOUS_DISTINCT}" \
              --arg deployed_at "${DEPLOYED_AT}" \
              --arg action "${DEPLOY_ACTION}" \
              --arg actor "${GITHUB_ACTOR}" \
              --arg run_id "${GITHUB_RUN_ID}" \
              --arg workflow "${GITHUB_WORKFLOW}" \
              --arg commit "${GITHUB_SHA}" \
              '
                .prod_current_version = $version
                | .prod_previous_version = $previous
                | .prod_deployed_at = $deployed_at
                | .prod_history = (
                    [
                      {
                        "version": $version,
                        "deployed_at": $deployed_at,
                        "action": $action,
                        "actor": $actor,
                        "run_id": $run_id,
                        "workflow": $workflow,
                        "commit": $commit
                      }
                    ]
                    +
                    (.prod_history // [])
                  )
              ' \
              "${STATE_FILE}" > "${STATE_FILE}.tmp"

            mv "${STATE_FILE}.tmp" "${STATE_FILE}"
          fi

          echo "State before commit:"
          jq . "${STATE_FILE}"

          cd pages-state-work

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .deployment-state/deployment-state.json

          if git diff --cached --quiet; then
            echo "ERROR: deployment state did not change."
            exit 1
          fi

          git commit -m "deployment state: ${DEPLOY_ENV} ${VERSION}"

          git push origin HEAD:pages-state

          echo "Deployment state pushed successfully."

      - name: Verify saved deployment state
        if: ${{ steps.validation.outputs.valid == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_ENV: ${{ inputs.environment }}
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf verify-pages-state

          git clone \
            --depth 1 \
            --single-branch \
            --branch pages-state \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            verify-pages-state

          STATE_FILE="verify-pages-state/.deployment-state/deployment-state.json"

          if [ ! -f "${STATE_FILE}" ]; then
            echo "Deployment state file was not found after save."
            exit 1
          fi

          echo "Persisted deployment state:"
          jq . "${STATE_FILE}"

          if [ "${DEPLOY_ENV}" = "uat" ]; then

            SAVED_VERSION=$(jq -r '.uat_version // ""' "${STATE_FILE}")

            echo "Expected UAT version: ${VERSION}"
            echo "Saved UAT version:    ${SAVED_VERSION}"

            if [ "${SAVED_VERSION}" != "${VERSION}" ]; then
              echo "UAT state verification failed."
              exit 1
            fi
          fi

          if [ "${DEPLOY_ENV}" = "prod" ]; then

            SAVED_VERSION=$(jq -r '.prod_current_version // ""' "${STATE_FILE}")

            echo "Expected PROD version: ${VERSION}"
            echo "Saved PROD version:    ${SAVED_VERSION}"

            if [ "${SAVED_VERSION}" != "${VERSION}" ]; then
              echo "PROD state verification failed."
              exit 1
            fi
          fi

          echo "Deployment state verification successful."

      - name: Get PROD approval details
        id: approval
        if: ${{ inputs.environment == 'prod' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          APPROVED_BY=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/approvals" \
            --jq '
              map(
                select(
                  .state == "approved"
                  and any(.environments[]?; .name == "prod")
                )
              )
              | last
              | .user.login // "Unavailable"
            ' \
            2>/dev/null || echo "Unavailable")

          if [ -z "${APPROVED_BY}" ]; then
            APPROVED_BY="Unavailable"
          fi

          echo "approved_by=${APPROVED_BY}" >> "$GITHUB_OUTPUT"

      - name: Deployment Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          ACTION: ${{ inputs.deployment_action }}
          SOURCE: ${{ inputs.artifact_source }}
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
          HEALTH: ${{ steps.health.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          VALIDATION: ${{ steps.validation.outputs.valid }}
          CURRENT_PROD: ${{ steps.state.outputs.current_prod }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          APPROVED_BY: ${{ steps.approval.outputs.approved_by }}
        run: |
          STATUS="INVALID"
          HEALTH_STATUS="FAIL"
          PLAYWRIGHT_STATUS="FAIL"

          if [ "${VALIDATION}" = "true" ]; then
            STATUS="VALID"
          fi

          if [ "${HEALTH}" = "success" ]; then
            HEALTH_STATUS="PASS"
          fi

          if [ "${PLAYWRIGHT}" = "success" ]; then
            PLAYWRIGHT_STATUS="PASS"
          fi

          if [ "${SOURCE}" = "release" ]; then
            SOURCE_LABEL="GitHub Release"
          else
            SOURCE_LABEL="PR Snapshot"
          fi

          echo "# Deployment Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Action | \`${ACTION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${DEPLOY_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact Source | ${SOURCE_LABEL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`microsite-${VERSION}.zip\` |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            echo "| Approved By | \`${APPROVED_BY:-Unavailable}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Previous PROD | \`${CURRENT_PROD:-None}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "| HTTP Health | **${HEALTH_STATUS}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Playwright E2E | **${PLAYWRIGHT_STATUS}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Report | \`playwright-report-${DEPLOY_ENV}-${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | **${STATUS}** |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DEPLOY_ENV}" = "prod" ] && \
             [ "${ROLLBACK}" = "success" ]; then
            echo "| Automatic Rollback | **SUCCESS** |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${DEPLOY_URL}" ]; then
            echo "## Live URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${DEPLOY_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ "${STATUS}" = "VALID" ]; then
            echo "## VALID" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## INVALID" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail deployment after validation failure
        if: ${{ steps.validation.outputs.valid == 'false' }}
        run: |
          echo "Deployment validation failed."

          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "Previous production content was restored automatically."
          fi

          exit 1