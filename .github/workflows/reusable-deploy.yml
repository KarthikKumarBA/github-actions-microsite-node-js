name: Reusable Deploy

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string

      environment:
        required: true
        type: string

      artifact_source:
        required: true
        type: string

      deployment_action:
        required: false
        type: string
        default: deploy

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.urls.outputs.deploy_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download published release artifact
        if: ${{ inputs.artifact_source == 'release' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh release download "v${VERSION}" \
            --repo "${REPOSITORY}" \
            --pattern "microsite-${VERSION}.zip"

      - name: Download PR snapshot artifact
        if: ${{ inputs.artifact_source == 'snapshot' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ARTIFACT_NAME="microsite-${VERSION}"

          ARTIFACT_ID=$(gh api \
            "repos/${REPOSITORY}/actions/artifacts?name=${ARTIFACT_NAME}" \
            --jq '.artifacts
                  | map(select(.expired == false))
                  | sort_by(.created_at)
                  | reverse
                  | .[0].id // empty')

          if [ -z "${ARTIFACT_ID}" ]; then
            echo "Snapshot artifact not found: ${ARTIFACT_NAME}"
            exit 1
          fi

          mkdir -p snapshot-download

          gh api \
            "repos/${REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > snapshot-download/artifact.zip

          unzip \
            snapshot-download/artifact.zip \
            -d snapshot-download/content

          cp \
            "snapshot-download/content/microsite-${VERSION}.zip" \
            "microsite-${VERSION}.zip"

      - name: Verify artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          test -f "microsite-${VERSION}.zip"
          echo "Artifact verified: microsite-${VERSION}.zip"

      - name: Extract artifact
        env:
          VERSION: ${{ inputs.version }}
        run: |
          rm -rf release
          mkdir -p release

          unzip \
            "microsite-${VERSION}.zip" \
            -d release

          test -f release/index.html

      - name: Restore existing Pages state
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf site
          mkdir -p site

          if git ls-remote \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            refs/heads/pages-state | grep -q pages-state; then

            rm -rf pages-existing

            git clone \
              --single-branch \
              --branch pages-state \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
              pages-existing

            cp -R pages-existing/. site/
            rm -rf site/.git
          fi

      - name: Backup current deployment
        run: |
          rm -rf site-before-deploy
          mkdir -p site-before-deploy
          cp -R site/. site-before-deploy/

      - name: Read deployment state
        id: state
        run: |
          STATE_FILE="site/.deployment-state/deployment-state.json"

          UAT_VERSION=""
          CURRENT_PROD=""
          PREVIOUS_PROD=""

          if [ -f "${STATE_FILE}" ]; then
            UAT_VERSION=$(jq -r '.uat_version // ""' "${STATE_FILE}")
            CURRENT_PROD=$(jq -r '.prod_current_version // ""' "${STATE_FILE}")
            PREVIOUS_PROD=$(jq -r '.prod_previous_version // ""' "${STATE_FILE}")
          fi

          echo "uat_version=${UAT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "current_prod=${CURRENT_PROD}" >> "$GITHUB_OUTPUT"
          echo "previous_prod=${PREVIOUS_PROD}" >> "$GITHUB_OUTPUT"

      - name: Prepare environment content
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [ "${DEPLOY_ENV}" = "prod" ]; then

            find site \
              -maxdepth 1 \
              -type f \
              -delete

            cp -R release/. site/

          else

            rm -rf "site/${DEPLOY_ENV}"
            mkdir -p "site/${DEPLOY_ENV}"

            cp -R release/. "site/${DEPLOY_ENV}/"

          fi

      - name: Verify Pages content
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          if [ "${DEPLOY_ENV}" = "prod" ]; then
            test -f site/index.html
          else
            test -f "site/${DEPLOY_ENV}/index.html"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages
          path: site

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages

      - name: Calculate deployment URL
        id: urls
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          BASE_URL="${PAGE_URL%/}"

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            DEPLOY_URL="${BASE_URL}/"
          else
            DEPLOY_URL="${BASE_URL}/${DEPLOY_ENV}/"
          fi

          echo "deploy_url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: ${DEPLOY_URL}"

      - name: Wait for GitHub Pages
        id: health
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
        run: |
          for i in {1..12}; do

            STATUS=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              "${DEPLOY_URL}")

            echo "Attempt ${i}: HTTP ${STATUS}"

            if [ "${STATUS}" = "200" ]; then
              exit 0
            fi

            sleep 10
          done

          exit 1

      - name: Run Playwright post-deployment test
        id: playwright
        if: ${{ steps.health.outcome == 'success' }}
        continue-on-error: true
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
          DEPLOY_ENV: ${{ inputs.environment }}
          PLAYWRIGHT_HTML_OPEN: never
        run: |
          npx playwright test --reporter=html

      - name: Upload Playwright test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ inputs.environment }}-${{ inputs.version }}
          path: playwright-report
          retention-days: 30
          if-no-files-found: ignore

      - name: Determine validation result
        id: validation
        env:
          HEALTH_RESULT: ${{ steps.health.outcome }}
          PLAYWRIGHT_RESULT: ${{ steps.playwright.outcome }}
        run: |
          if [ "${HEALTH_RESULT}" = "success" ] && \
             [ "${PLAYWRIGHT_RESULT}" = "success" ]; then

            echo "valid=true" >> "$GITHUB_OUTPUT"

          else

            echo "valid=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore previous PROD content
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        run: |
          echo "Production validation failed."
          echo "Restoring previous known-good production content."

          rm -rf site
          mkdir -p site

          cp -R site-before-deploy/. site/

          test -f site/index.html

      - name: Upload rollback Pages artifact
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-rollback
          path: site

      - name: Deploy automatic rollback
        id: rollback
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-rollback

      - name: Verify automatic rollback
        if: ${{ inputs.environment == 'prod' && steps.validation.outputs.valid == 'false' }}
        env:
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
        run: |
          for i in {1..12}; do

            STATUS=$(curl \
              -L \
              -s \
              -o /dev/null \
              -w "%{http_code}" \
              "${DEPLOY_URL}")

            echo "Rollback check ${i}: HTTP ${STATUS}"

            if [ "${STATUS}" = "200" ]; then
              echo "Rollback successful"
              exit 0
            fi

            sleep 10
          done

          echo "Automatic rollback validation failed"
          exit 1

      - name: Update deployment state
        if: ${{ steps.validation.outputs.valid == 'true' }}
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          CURRENT_PROD: ${{ steps.state.outputs.current_prod }}
        run: |
          STATE_DIR="site/.deployment-state"
          STATE_FILE="${STATE_DIR}/deployment-state.json"

          mkdir -p "${STATE_DIR}"

          if [ ! -f "${STATE_FILE}" ]; then
            cat > "${STATE_FILE}" <<EOF
          {
            "uat_version": "",
            "uat_deployed_at": "",
            "prod_current_version": "",
            "prod_previous_version": "",
            "prod_deployed_at": ""
          }
          EOF
          fi

          DEPLOYED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [ "${DEPLOY_ENV}" = "uat" ]; then

            jq \
              --arg version "${VERSION}" \
              --arg deployed_at "${DEPLOYED_AT}" \
              '
              .uat_version = $version
              | .uat_deployed_at = $deployed_at
              ' \
              "${STATE_FILE}" > "${STATE_FILE}.tmp"

            mv "${STATE_FILE}.tmp" "${STATE_FILE}"
          fi

          if [ "${DEPLOY_ENV}" = "prod" ]; then

            jq \
              --arg current "${VERSION}" \
              --arg previous "${CURRENT_PROD}" \
              --arg deployed_at "${DEPLOYED_AT}" \
              '
              .prod_current_version = $current
              | .prod_previous_version = $previous
              | .prod_deployed_at = $deployed_at
              ' \
              "${STATE_FILE}" > "${STATE_FILE}.tmp"

            mv "${STATE_FILE}.tmp" "${STATE_FILE}"
          fi

          cat "${STATE_FILE}"

      - name: Save Pages state
        if: ${{ steps.validation.outputs.valid == 'true' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          rm -rf pages-state-work
          mkdir -p pages-state-work

          cp -R site/. pages-state-work/

          cd pages-state-work

          git init
          git checkout -b pages-state

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add .
          git commit -m "deploy ${VERSION} to ${DEPLOY_ENV}"

          git remote add origin \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          git push \
            --force \
            origin pages-state

      - name: Get PROD approval details
        id: approval
        if: ${{ inputs.environment == 'prod' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          APPROVED_BY=$(gh api \
            "repos/${REPOSITORY}/actions/runs/${RUN_ID}/approvals" \
            --jq '
              map(
                select(
                  .state == "approved"
                  and any(.environments[]?; .name == "prod")
                )
              )
              | last
              | .user.login // "Unavailable"
            ' \
            2>/dev/null || echo "Unavailable")

          if [ -z "${APPROVED_BY}" ]; then
            APPROVED_BY="Unavailable"
          fi

          echo "approved_by=${APPROVED_BY}" >> "$GITHUB_OUTPUT"
          echo "Approved by: ${APPROVED_BY}"

      - name: Deployment Summary
        if: always()
        env:
          VERSION: ${{ inputs.version }}
          DEPLOY_ENV: ${{ inputs.environment }}
          ACTION: ${{ inputs.deployment_action }}
          SOURCE: ${{ inputs.artifact_source }}
          DEPLOY_URL: ${{ steps.urls.outputs.deploy_url }}
          HEALTH: ${{ steps.health.outcome }}
          PLAYWRIGHT: ${{ steps.playwright.outcome }}
          VALIDATION: ${{ steps.validation.outputs.valid }}
          CURRENT_PROD: ${{ steps.state.outputs.current_prod }}
          ROLLBACK: ${{ steps.rollback.outcome }}
          APPROVED_BY: ${{ steps.approval.outputs.approved_by }}
        run: |
          STATUS="INVALID"
          HEALTH_STATUS="FAIL"
          PLAYWRIGHT_STATUS="FAIL"

          if [ "${VALIDATION}" = "true" ]; then
            STATUS="VALID"
          fi

          if [ "${HEALTH}" = "success" ]; then
            HEALTH_STATUS="PASS"
          fi

          if [ "${PLAYWRIGHT}" = "success" ]; then
            PLAYWRIGHT_STATUS="PASS"
          fi

          if [ "${SOURCE}" = "release" ]; then
            SOURCE_LABEL="GitHub Release"
          else
            SOURCE_LABEL="PR Snapshot"
          fi

          echo "# Deployment Validation Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"

          echo "| Action | \`${ACTION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | \`${DEPLOY_ENV}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact Source | ${SOURCE_LABEL} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`microsite-${VERSION}.zip\` |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DEPLOY_ENV}" = "prod" ]; then
            echo "| Approved By | \`${APPROVED_BY:-Unavailable}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| Previous PROD | \`${CURRENT_PROD:-None}\` |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "| HTTP Health | **${HEALTH_STATUS}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Playwright E2E | **${PLAYWRIGHT_STATUS}** |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Test Report | \`playwright-report-${DEPLOY_ENV}-${VERSION}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Validation | **${STATUS}** |" >> "$GITHUB_STEP_SUMMARY"

          if [ "${DEPLOY_ENV}" = "prod" ] && \
             [ "${ROLLBACK}" = "success" ]; then

            echo "| Automatic Rollback | **SUCCESS** |" >> "$GITHUB_STEP_SUMMARY"
          fi

          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "${DEPLOY_URL}" ]; then
            echo "## Live URL" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "${DEPLOY_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail deployment after validation failure
        if: ${{ steps.validation.outputs.valid == 'false' }}
        run: |
          echo "Deployment validation failed."

          if [ "${{ inputs.environment }}" = "prod" ]; then
            echo "Previous production content was restored automatically."
          fi

          exit 1