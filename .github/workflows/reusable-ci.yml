name: Reusable CI

on:
  workflow_call:
    inputs:
      version:
        description: Build version
        required: true
        type: string
      artifact-name:
        description: Artifact name
        required: true
        type: string
    outputs:
      version:
        description: Build version
        value: ${{ jobs.build.outputs.version }}

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint JavaScript
        run: npm run lint

      - name: Lint HTML
        run: npm run lint:html

      - name: Check formatting
        run: npm run format:check

      - name: Unit tests and coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Set version
        id: version
        run: echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create package
        run: |
          cd dist
          zip -r "../${{ inputs.artifact-name }}.zip" .
          cd ..

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-name }}.zip
          retention-days: 30

      - name: CI Summary
        run: |
          echo "## CI Build Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ inputs.version }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Artifact | \`${{ inputs.artifact-name }}.zip\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tests | Passed |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build | Passed |" >> "$GITHUB_STEP_SUMMARY"
